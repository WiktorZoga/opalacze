<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Riptide: the AI ad agency that rides virals. Run by a Grok Bot swarm.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04121f"/>
      <stop offset="1" stop-color="#082a3a"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <style>
      .sans { font-family: 'Inter', 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- background swell -->
  <path d="M0 290 C 160 250, 320 330, 480 290 S 800 250, 960 290 S 1180 330, 1280 300 L1280 360 L0 360 Z" fill="#2dd4bf" fill-opacity="0.07"/>
  <path d="M0 315 C 200 285, 360 350, 560 315 S 900 285, 1100 318 S 1240 340, 1280 330 L1280 360 L0 360 Z" fill="#38bdf8" fill-opacity="0.08"/>

  <!-- wave mark -->
  <g transform="translate(96 92)">
    <rect width="120" height="120" rx="28" fill="#0b3a4e" stroke="#2dd4bf" stroke-opacity="0.35"/>
    <path d="M18 78 C 34 52, 56 40, 76 48 C 92 54, 94 72, 80 76 C 70 79, 64 70, 70 63" fill="none" stroke="url(#wave)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 96 C 40 86, 58 100, 80 92 S 100 84, 104 88" fill="none" stroke="#2dd4bf" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>
  </g>

  <text x="248" y="186" class="sans" font-size="108" font-weight="700" fill="#f1f7fa" letter-spacing="-3">Riptide</text>
  <text x="252" y="232" class="sans" font-size="28" fill="#9fc3d1">The AI ad agency that rides virals.</text>
  <text x="252" y="270" class="mono" font-size="16" fill="#2dd4bf" letter-spacing="2">RUN BY A GROK BOT SWARM &#183; BRIEF &#8594; TREND &#8594; DNA &#8594; UGC &#8594; CRITIC &#8594; PUBLISH</text>

  <!-- tone chips -->
  <g class="mono" font-size="14">
    <rect x="964" y="112" width="220" height="36" rx="18" fill="#0b3a4e" stroke="#2dd4bf" stroke-opacity="0.5"/>
    <text x="1074" y="135" text-anchor="middle" fill="#cfe9f1">UGC</text>
    <rect x="964" y="160" width="220" height="36" rx="18" fill="#0b3a4e" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="1074" y="183" text-anchor="middle" fill="#cfe9f1">Polished ad</text>
    <rect x="964" y="208" width="220" height="36" rx="18" fill="#0b3a4e" stroke="#9fc3d1" stroke-opacity="0.4"/>
    <text x="1074" y="231" text-anchor="middle" fill="#cfe9f1">Brainrot</text>
  </g>
</svg>
